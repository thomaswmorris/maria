  short_name: NET_RJ
  math_name: \text{NET}_\text{RJ}
  base_unit: K_RJ√s
  base_unit_prefix: ""
  vector:
    K_RJ: 1
    s: 0.5
  units:
    K_RJ√s:
      factor: 1
      long_name: kelvin Rayleigh-Jeans per square root hertz
      math_name: \text{K}_\text{RJ}\sqrt{\text{s}}
